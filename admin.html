<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compta · Espace admin</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="app-styles.css">

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

  <style>
    /* Sidebar admin theme override */
    .app-sidebar { background: #1A1A1F !important; color: white !important; }
    .app-sidebar .sidebar-section { color: rgba(255,255,255,0.4) !important; }
    .app-sidebar .sidebar-link { color: rgba(255,255,255,0.7) !important; }
    .app-sidebar .sidebar-link:hover { background: rgba(255,255,255,0.05) !important; color: white !important; }
    .app-sidebar .sidebar-link.active { background: rgba(255,255,255,0.1) !important; color: white !important; }
    .app-sidebar .logo { color: white !important; }
  </style>
</head>
<body>
  <div id="root">
    <div style="display: grid; place-items: center; height: 100vh; color: #6B7280; font-family: system-ui, sans-serif;">Chargement…</div>
  </div>
  <script type="text/babel" src="components/icons.jsx"></script>
  <script type="text/babel" src="app/shared.jsx"></script>
  <script type="text/babel" src="admin/shell.jsx"></script>
  <script type="text/babel" src="admin/pages.jsx"></script>
  <script type="text/babel" src="admin/dossier-detail.jsx"></script>
  <script type="text/babel">
    // Expose helpers utilisés par dossier-detail
    window.fmtDate = (iso) => new Date(iso).toLocaleDateString('fr-FR', { day: '2-digit', month: 'short', year: 'numeric' });
    window.StatusPill = ({ statut }) => {
      const map = {
        DRAFT: { label: 'Brouillon', cls: 'gray' },
        AWAITING_VALIDATION: { label: 'À valider', cls: 'blue' },
        INTERNAL_AMENDMENT_PENDING: { label: 'En correction', cls: 'orange' },
        VALIDATED_INTERNAL: { label: 'Validé interne', cls: 'green' },
        RECEIVED: { label: 'Reçu INPI', cls: 'blue' },
        VALIDATED: { label: 'Validé INPI', cls: 'green' },
        REJECTED: { label: 'Rejeté INPI', cls: 'red' },
      };
      const s = map[statut] || { label: statut, cls: 'gray' };
      return <span className={`pill ${s.cls}`} style={{ fontSize: 12 }}><span className="dot"></span>{s.label}</span>;
    };

    function mount() {
      if (!window.AdminApp) return setTimeout(mount, 50);
      ReactDOM.createRoot(document.getElementById('root')).render(<window.AdminApp />);
    }
    mount();
  </script>
</body>
</html>
