<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Legaly AI · Wizard</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="app-styles.css">

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>
  <script>
    // Si pas de wizard demandé, on renvoie vers le dashboard Next.js
    (function () {
      const sp = new URLSearchParams(window.location.search);
      if (!sp.get('route') && !sp.get('type')) {
        window.location.replace('/dashboard');
        return;
      }
      // Auth check
      window.supabaseClient.auth.getSession().then(({ data }) => {
        if (!data.session) window.location.replace('/auth/login');
      });
    })();
  </script>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root">
    <div style="display: grid; place-items: center; height: 100vh; color: var(--ink-500); font-family: 'Geist', system-ui, sans-serif;">
      Chargement du wizard…
    </div>
  </div>

  <script type="text/babel" src="components/icons.jsx"></script>
  <script type="text/babel" src="app/api.jsx"></script>
  <script type="text/babel" src="app/wizard-shared.jsx"></script>
  <script type="text/babel" src="app/wizard-creation.jsx"></script>
  <script type="text/babel" src="app/wizard-modification.jsx"></script>
  <script type="text/babel" src="app/wizard-cessation.jsx"></script>
  <script type="text/babel" src="app/wizard-sasu.jsx"></script>
  <script type="text/babel" src="app/wizard-sas.jsx"></script>
  <script type="text/babel" src="app/wizard-eurl.jsx"></script>
  <script type="text/babel" src="app/wizard-sarl.jsx"></script>
  <script type="text/babel" src="app/wizard-sci.jsx"></script>
  <script type="text/babel" src="app/wizard-holding.jsx"></script>
  <script type="text/babel" src="app/wizard-be.jsx"></script>
  <script type="text/babel" src="app/wizard-comptes.jsx"></script>

  <script type="text/babel">
    const WIZARDS = {
      AE: 'WizardCreation', SASU: 'WizardSASU', SAS: 'WizardSAS', EURL: 'WizardEURL',
      SARL: 'WizardSARL', SCI: 'WizardSCI', HOLDING: 'WizardHolding',
      MODIFICATION: 'WizardModification', RADIATION: 'WizardCessation',
      BE: 'WizardBE', COMPTES: 'WizardComptes',
    };

    function WizardHost() {
      const sp = new URLSearchParams(window.location.search);
      const type = sp.get('type');
      const dossierId = sp.get('d');
      const Comp = WIZARDS[type] && window[WIZARDS[type]];

      const back = () => { window.location.href = dossierId ? `/dossiers/${dossierId}` : '/dossiers'; };
      const onCreated = () => { window.location.href = '/dossiers'; };

      if (!Comp) {
        return (
          <div className="app-content with-bg">
            <div className="app-card" style={{ padding: 24, maxWidth: 540, margin: '64px auto' }}>
              <h2>Wizard introuvable</h2>
              <p>Type demandé : <code>{type || '(aucun)'}</code></p>
              <a href="/dossiers" className="btn btn-accent">Retour aux dossiers</a>
            </div>
          </div>
        );
      }

      return (
        <div className="app-content with-bg" style={{ maxWidth: 920, margin: '0 auto', padding: '32px 24px' }}>
          <button onClick={back} className="btn btn-ghost btn-sm" style={{ marginBottom: 16 }}>
            ← Retour au dossier
          </button>
          <Comp dossierId={dossierId} setRoute={(r) => { if (r === 'dossiers') window.location.href = '/dossiers'; }} onCreated={onCreated} />
        </div>
      );
    }

    function mount() {
      if (!window.WC) return setTimeout(mount, 50);
      ReactDOM.createRoot(document.getElementById('root')).render(<WizardHost />);
    }
    mount();
  </script>
</body>
</html>
