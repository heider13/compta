<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compta — Créer un compte</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="../supabase-client.js" defer></script>
  <style>
    body { background: var(--ink-50); min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    .auth-card {
      width: 100%; max-width: 460px;
      background: white;
      border: 1px solid var(--ink-150);
      border-radius: 20px;
      padding: 40px;
      box-shadow: var(--shadow-lg);
    }
    .auth-logo {
      display: flex; align-items: center; gap: 10px; justify-content: center;
      font-size: 22px; font-weight: 600; letter-spacing: -0.02em;
      margin-bottom: 28px;
    }
    .auth-input {
      width: 100%; padding: 12px 14px;
      border: 1px solid var(--ink-200);
      border-radius: 10px;
      font-size: 15px; outline: none;
      font-family: inherit;
      transition: all .15s ease;
    }
    .auth-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px color-mix(in oklab, var(--accent) 18%, transparent);
    }
    .auth-label { font-size: 13px; font-weight: 500; color: var(--ink-700); margin-bottom: 6px; display: block; }
    .auth-foot { text-align: center; font-size: 13px; color: var(--ink-500); margin-top: 24px; }
    .auth-foot a { color: var(--accent-ink); font-weight: 500; }
    .divider-text {
      display: flex; align-items: center; gap: 12px;
      margin: 20px 0;
      font-size: 12px;
      color: var(--ink-400);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .divider-text::before, .divider-text::after {
      content: ''; flex: 1; height: 1px; background: var(--ink-150);
    }
    .sso-btn {
      width: 100%; padding: 11px;
      border: 1px solid var(--ink-200);
      border-radius: 10px;
      background: white;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      font-size: 14px; font-weight: 500;
      color: var(--ink-900);
      transition: all .12s ease;
    }
    .sso-btn:hover { background: var(--ink-50); border-color: var(--ink-300); }
    .check {
      display: flex; align-items: flex-start; gap: 10px;
      font-size: 12px; color: var(--ink-600); margin-top: 14px;
      cursor: pointer;
    }
    .check input { margin-top: 2px; accent-color: var(--accent); }
    .check a { color: var(--accent-ink); }
  </style>
</head>
<body>
  <div class="auth-card">
    <a href="../index.html" class="auth-logo" style="text-decoration: none; color: var(--ink-900);">
      <span class="logo-mark">C</span> compta
    </a>
    <h2 style="font-size: 24px; text-align: center; margin-bottom: 6px;">Créez votre compte</h2>
    <p style="text-align: center; font-size: 14px; color: var(--ink-500); margin-bottom: 24px;">Gratuit · sans engagement · sans CB.</p>

    <button class="sso-btn" id="googleBtn">
      <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      Continuer avec Google
    </button>

    <div class="divider-text">ou</div>

    <form id="signupForm">
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px;">
        <div>
          <label class="auth-label">Prénom</label>
          <input class="auth-input" id="firstName" placeholder="Jean" required autofocus />
        </div>
        <div>
          <label class="auth-label">Nom</label>
          <input class="auth-input" id="lastName" placeholder="Dupont" required />
        </div>
      </div>
      <div style="margin-bottom: 14px;">
        <label class="auth-label">Email</label>
        <input class="auth-input" type="email" id="email" placeholder="vous@exemple.fr" required />
      </div>
      <div style="margin-bottom: 4px;">
        <label class="auth-label">Mot de passe</label>
        <input class="auth-input" type="password" id="password" placeholder="Au moins 8 caractères" required minlength="8" />
        <div style="font-size: 11px; color: var(--ink-500); margin-top: 6px;">8 caractères min · 1 majuscule · 1 chiffre</div>
      </div>
      <label class="check">
        <input type="checkbox" required />
        <span>J'accepte les <a href="#">CGU</a> et la <a href="#">politique de confidentialité</a>.</span>
      </label>
      <div id="msg" style="display:none; font-size:13px; margin-top:10px;"></div>
      <button type="submit" class="btn btn-accent btn-lg" style="width: 100%; margin-top: 20px;">
        Créer mon compte
      </button>
    </form>

    <div class="auth-foot">
      Déjà un compte ? <a href="login.html">Se connecter</a>
    </div>
  </div>

  <script>
    function showMsg(text, isError) {
      const el = document.getElementById('msg');
      el.textContent = text;
      el.style.color = isError ? '#b42318' : '#067647';
      el.style.display = 'block';
    }

    window.addEventListener('load', () => {
      document.getElementById('signupForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const { data, error } = await window.supabaseClient.auth.signUp({
          email: document.getElementById('email').value,
          password: document.getElementById('password').value,
          options: {
            data: {
              first_name: document.getElementById('firstName').value,
              last_name: document.getElementById('lastName').value,
            },
          },
        });
        if (error) return showMsg(error.message, true);
        if (data.session) {
          window.location.href = '../app.html';
        } else {
          showMsg('Compte créé. Vérifie ta boîte mail pour confirmer ton adresse.', false);
        }
      });

      document.getElementById('googleBtn').addEventListener('click', async () => {
        const { error } = await window.supabaseClient.auth.signInWithOAuth({
          provider: 'google',
          options: { redirectTo: new URL('../app.html', window.location.href).toString() },
        });
        if (error) showMsg(error.message, true);
      });
    });
  </script>
</body>
</html>
